# Application
spring.application.name=pinceletas-admin-config-service
server.port=${PORT:8083}

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.format_sql=false

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.cache.disabled=true

# Logs para debugging
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springdoc=INFO
logging.level.ar.edu.utn.frc.tup.tesis.pinceletas_admin_config_service=INFO

# Spring cache configuration
spring.cache.cache-names=dashboard,reports,config,userStats,productGeneralStats,productsByCategory,topSellingProducts
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

# Dashboard Cache Settings
app.dashboard.cache.enabled=true
app.dashboard.cache.ttl=300000

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL}

# External Services Configuration
app.services.user-auth.url=${USER_AUTH_SERVICE_URL}
app.services.user-auth.reports-path=/api/reports/users/active-inactive

# ? NUEVO: Commerce Service Configuration - AGREGADO PARA INTEGRACION CON COMMERCE
app.services.commerce.url=${COMMERCE_SERVICE_URL}
app.services.commerce.reports-path=/api/reports

app.jwt.secret=${JWT_SECRET:supersecretkeysupersecretkeysupersecretkey}